version: "3.9"

services:
  llm-engine:
    build: .
    image: llm-inference-engine:latest
    container_name: llm-engine
    runtime: nvidia
    ports:
      - "8000:8000"
    volumes:
      - ./models:/models
      - ./configs:/app/configs:ro
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - HF_HOME=/models/hf
      - ENGINE_DIR=/models/engines
    shm_size: "16g"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: ["--config", "configs/server.yaml"]

  # Optional load generator for quick local smoke tests.
  benchmark:
    image: llm-inference-engine:latest
    profiles: ["bench"]
    depends_on: [llm-engine]
    entrypoint: ["python", "benchmarks/benchmark_serving.py"]
    command: ["--host", "llm-engine", "--port", "8000", "--num-prompts", "200"]

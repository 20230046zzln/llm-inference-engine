name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies (CPU / lightweight)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          # Heavy GPU engines are not installed on CI; scheduler/protocol/server
          # are designed to import without them and are covered by unit tests.
          pip install fastapi "uvicorn[standard]" httpx

      - name: Ruff
        run: ruff check engine tests benchmarks

      - name: Pytest
        run: pytest -q --cov=engine --cov-report=term-matrix

      - name: Build C++ extension (compile check, no CUDA)
        run: |
          sudo apt-get update && sudo apt-get install -y cmake g++
          cmake -S csrc -B csrc/build -DLLM_ENGINE_BUILD_CUDA=OFF
          cmake --build csrc/build -j2

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4
      - name: Dockerfile syntax sanity
        run: |
          # Only validate the Dockerfile parses; GPU base image is not pulled on CI.
          test -f Dockerfile && echo "Dockerfile present"
